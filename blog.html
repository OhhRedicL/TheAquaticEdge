<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1F33">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Blog | Laboy Aquatics Co</title>
  <meta name="description" content="Professional development and leadership track articles for lifeguards, supervisors, and aquatics leaders.">
</head>
<body data-page="blog">
<header id="site-nav"></header>
<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Blog</div>
      <h1 id="blog-title">The Blog</h1>
      <p id="blog-sub">Insights, lessons, and leadership tools from the deck, the ambulance, and the director's office.</p>
    </div>
    <div class="hero-waves" aria-hidden="true">
      <svg class="w1" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#46BCBB" d="M0 80c240 40 480 40 720 0s480-40 720 0 480 40 720 0 480-40 720 0v80H0z"/></svg>
      <svg class="w2" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#2A9590" d="M0 100c240-40 480-40 720 0s480 40 720 0 480-40 720 0 480 40 720 0v60H0z"/></svg>
      <svg class="w3" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#ffffff" d="M0 120c240 25 480 25 720 0s480-25 720 0 480 25 720 0 480-25 720 0v40H0z"/></svg>
    </div>
  </section>

  <section class="section" style="padding-top:60px">
    <div class="container">
      <div class="filters">
        <button class="filter" data-cat="all">All Posts</button>
        <button class="filter" data-cat="development">Professional Development</button>
        <button class="filter" data-cat="leadership">Leadership Track</button>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="post-search" type="search" placeholder="Search articles…" aria-label="Search articles">
        </label>
      </div>
      <div class="posts" id="all-posts"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="newsletter reveal">
        <div><h2>Never miss a post</h2><p>Get new articles and podcast episodes delivered to your inbox.</p></div>
        <div>
          <form class="nl-form"><input type="email" placeholder="you@email.com" required aria-label="Email address"><button class="btn btn--primary" type="submit">Subscribe</button></form>
          <p class="nl-note">No spam. Unsubscribe anytime.</p>
        </div>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
